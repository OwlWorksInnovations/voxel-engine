name: CMake (build + artifact)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # ─── Linux dependencies ─────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libglfw3-dev \
            libopengl-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            zip

      # ─── Windows vcpkg + GLFW ───────────────────────────
      - name: Install vcpkg and GLFW
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat
          ./vcpkg/vcpkg install glfw3:x64-windows

      # ─── Configure CMake ───────────────────────────────
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build
          -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build
          -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      # ─── Build ─────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release

      # ─── Zip dist folder ───────────────────────────────
      - name: Zip dist (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          zip -r dist-linux.zip dist

      - name: Zip dist (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path build/dist/* -DestinationPath dist-windows.zip

      # ─── Upload artifact ───────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist-*.zip
            build/dist-*.zip
