name: CMake (cross-platform)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # ─── Linux Dependencies ───────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libglfw3-dev \
            libopengl-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev

      # ─── Build Directory ─────────────────────────────────
      - name: Set build dir
        id: vars
        run: echo "build_dir=${{ github.workspace }}/build" >> $GITHUB_OUTPUT

      # ─── Configure ───────────────────────────────────────
      - name: Configure CMake
        run: >
          cmake -B ${{ steps.vars.outputs.build_dir }}
          -S ${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      # ─── Build ───────────────────────────────────────────
      - name: Build
        run: cmake --build ${{ steps.vars.outputs.build_dir }} --config Release

      # ─── Test (Headless-safe) ────────────────────────────
      - name: Run tests (Linux headless)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.vars.outputs.build_dir }}
        run: xvfb-run ctest --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.vars.outputs.build_dir }}
        run: ctest --output-on-failure
