name: CMake (build + artifact)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # ─── Linux deps ──────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libglfw3-dev \
            libopengl-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev

      # ─── vcpkg (Windows) ─────────────────────────────────
      - name: Setup vcpkg
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11

      - name: Install GLFW (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install glfw3

      # ─── Configure ───────────────────────────────────────
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build
          -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build
          -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      # ─── Build ───────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release

      # ─── Zip dist ────────────────────────────────────────
      - name: Zip dist (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          zip -r dist-${{ matrix.os }}.zip dist

      - name: Zip dist (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path build/dist/* -DestinationPath dist-${{ matrix.os }}.zip

      # ─── Upload artifact ─────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            build/dist-*.zip
            dist-*.zip
